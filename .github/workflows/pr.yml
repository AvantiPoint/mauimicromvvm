name: MauiMicroMvvm PR Validation

on:
  pull_request:
    branches: [ master ]
    paths:
      - "sample/**"
      - "src/**"
      - "tests/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "MauiMicroMvvm.sln"
      - "version.json"
      - "build.slnf"
      - ".github/workflows/pr.yml"

jobs:
  build:
    uses: avantipoint/workflow-templates/.github/workflows/dotnet-build.yml@master
    with:
      name: MauiMicroMvvm
      solution-path: build.slnf
      dotnet-version: 8.0.x
      install-workload: maui

  validate:
    needs: [build]
    runs-on: macos-14
    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Pin .NET SDK for template validation
        run: |
          SDK_VERSION=$(dotnet --list-sdks | awk '/^8\./ { version=$1 } END { print version }')
          dotnet new globaljson --sdk-version "$SDK_VERSION" --roll-forward latestFeature
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: NuGet
          path: Artifacts
      - name: Install Templates
        run: dotnet new install Artifacts/AvantiPoint.MauiMicroMvvm.Templates.*.nupkg
      - name: Add Local Source
        run: dotnet nuget add source ${{ github.workspace }}/Artifacts --name Artifacts
      - name: Create Test Project
        run: dotnet new maui-micro -o TestProject
      - name: Workload Install
        run: dotnet workload install maui
        working-directory: TestProject
      - name: Build Project
        run: dotnet build -f net8.0-maccatalyst -p:MauiVersion=8.0.3
        working-directory: TestProject
